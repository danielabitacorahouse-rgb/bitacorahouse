<!-- BANNER: CONTACT ME (Modo Oscuro + Desenfoque) -->
<section class="contact-me-section scroll-blur-focus" id="contactSection">
  
  <!-- Agregamos "scroll-reveal fade-in-4s" aquí -->
  <div class="contact-container scroll-reveal fade-in-4s">
    
    <h1 class="contact-huge-title">Contact Us</h1>
    
    <div class="contact-content">
      <!-- Columna Izquierda: Información -->
      <div class="contact-info">
        <div class="info-block">
          <p>Tulsa, Oklahoma</p>
          <p>2026</p>
        </div>
        <div class="info-block">
          <p>@BitacoraHouse</p>
          <p>+1 (918) 815-5447</p>
          <p>Bitacorahouse@gmail.com</p>
        </div>
      </div>

      <!-- Columna Derecha: Formulario -->
      <div class="contact-form-wrapper">
        <form action="#" method="POST" class="contact-form">
          
          <div class="form-group-row">
            <div class="form-group w-50">
              <label>Name (required)</label>
              <input type="text" placeholder="First Name" required>
            </div>
            <div class="form-group w-50">
              <label class="hidden-label">&nbsp;</label>
              <input type="text" placeholder="Last Name" required>
            </div>
          </div>

          <div class="form-group">
            <label>Service</label>
            <select required>
              <option value="" disabled selected></option>
              <option value="branding">Branding</option>
              <option value="content">Content Creation</option>
              <option value="social">Social Media Management</option>
            </select>
          </div>

          <div class="form-group">
            <label>Email (required)</label>
            <input type="email" placeholder="" required>
          </div>

          <div class="form-checkbox">
            <!-- Checkbox estilo circular -->
            <input type="checkbox" id="newsletter">
            <label for="newsletter">Sign up for news and updates</label>
          </div>

          <div class="form-group">
            <label>Project description</label>
            <input type="text" placeholder="">
          </div>

          <button type="submit" class="submit-btn-inverted">Submit</button>
        </form>
      </div>
    </div>
  </div>
</section>
